<!DOCTYPE html>
<html>
  <head>
    <title>
      Amazon Button
    </title>
    <style>
      .back-to-amazon-anchor {
        color: rgb(0 113 133);
      }
      .product-name {
        font-size: 24px;
        font-weight: bold;
      }
      .price-and-availability {
        color: rgb(0 118 0);
        font-weight: bold;
      }
      .add-to-cart-button {
        background-color: rgb(255 216 20);
        font-size: 16px;
        font-weight: 500;
        height: 40px;
        width: 140px;
        border: none;
        border-radius: 20px;
      }
      .buy-now-button {
        background-color: rgb(255 164 28);
        font-size: 16px;
        font-weight: 500;
        height: 40px;
        width: 140px;
        border: none;
        border-radius: 20px;
      }
    </style>
  </head>
  <body>
    <a class="back-to-amazon-anchor"; href="https://www.amazon.com/"; target="_blank">
      Back to Amazon
    </a>
    <p class="product-name">
      Nike Black Running Shoes
    </p>
    <P class="price-and-availability">
      $39 - in stock.
    </P>
    <P class="delivery-info">
      Free delivery tomorrow.
    </P>
    <button class="add-to-cart-button">
      Add to Cart
    </button>
    <button class="buy-now-button">
      Buy now
    </button>
  </body>
</html>
