<!DOCTYPE html>
  <html>
    <head>
      <title>
        LinkedIn Button
      </title>
      <style>
        .apply-button {
          background-color: rgb(10 102 194);
          border-color: rgb(10 102 194);
          border-style: solid;
          color: white;
          font-size: 15px;
          font-weight: bold;
          height: 40px;
          width: 250px;
          border-radius: 20px;
          margin-right: 8px;
          cursor: pointer;
        }
        .save-button {
          background-color: white;
          color: rgb(10 102 194);
          border-color: rgb(10 102 194);
          border-style: solid;
          border-width: 1px;
          font-size: 15px;
          font-weight: bold;
          height: 40px;
          width: 80px;
          border-radius: 20px;
          cursor: pointer;
        }
      </style>
    </head>
    <body>
      <button class="apply-button">
        Apply on company website
      </button>
      <button class="save-button">
        Save
      </button>
    </body>
  </html>
