<!DOCTYPE html>
  <html>
    <head>
      <title>
        Bootstrap Button
      </title>
      <style>
        .get-started-button {
          background-color: rgb(121 82 179);
          color: white;
          border: none;
          height: 40px;
          width: 100px;
          border-radius: 3px;
          cursor: pointer;
          font-weight: bold;
          margin-right: 8px;
        }
        .download-button {
          background-color: white;
          color: rgb(108 117 125);
          border-color: rgb(108 117 125);
          height: 40px;
          width: 100px;
          border-radius: 3px;
          cursor: pointer;
          border-style: solid;
          font-weight: bold;
          border-width: 1px;
        }
      </style>
    </head>
    <body>
      <button class="get-started-button">
        Get started
      </button>
      <button class="download-button">
        Download
      </button>
    </body>
  </html>
