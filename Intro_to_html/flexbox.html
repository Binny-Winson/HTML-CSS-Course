<!DOCTYPE html>
<html>
  <head>
    <title>
      Flexbox Practice
    </title>
  </head>
  <body style="padding-bottom: 1000px;">
    <div style="
    display: flex; 
    flex-direction: row;
    ">
      <div style="background-color: lightblue;">div 1</div>
      <div style="background-color: lightpink;">div 2</div>
    </div>

    <div style="
    display: flex; 
    flex-direction: row;
    margin-top: 10px;
    ">
      <div style="background-color: lightblue; width: 100px;">100px</div>
      <div style="background-color: lightpink;">div 2 <p>Text</p></div> <!-- Adding extra line of text automatically expands all the flexboxes in the row -->
    </div>

    <div style="
    display: flex; 
    flex-direction: row;
    margin-top: 10px;
    ">
      <div style="background-color: lightblue; width: 100px;">100px</div>
      <div style="background-color: lightpink; flex: 1;">flex: 1</div> <!-- Adding extra line of text automatically expands all the flexboxes in the row -->
    </div>

    <div style="
    display: flex; 
    flex-direction: row;
    margin-top: 10px;
    ">
      <div style="background-color: lightblue; width: 100px;">100px</div>
      <div style="background-color: lightpink; flex: 1;">flex: 1</div> <!-- Adding extra line of text automatically expands all the flexboxes in the row -->
      <div style="background-color: lightblue; flex: 2;">flex: 2</div>
    </div>

    <div style="
    display: flex; 
    flex-direction: row;
    margin-top: 10px;
    height: 70px;
    border-color: gray;
    border-width: 1px;
    border-style: solid;
    ">
      <div style="background-color: lightblue; width: 100px;">100px</div>
      <div style="background-color: lightpink; flex: 1;">flex: 1</div> <!-- Adding extra line of text automatically expands all the flexboxes in the row -->
      <div style="background-color: lightblue; flex: 2;">flex: 2</div>
    </div>
  </body>
</html>
