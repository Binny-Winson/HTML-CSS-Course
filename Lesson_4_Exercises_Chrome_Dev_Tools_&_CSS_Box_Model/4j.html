<!DOCTYPE html>
<html>
  <head>
    <title>
      3D Click
    </title>
    <style>
      .shadow-3d-button {
        background-color: green;
        color: white;
        border: none;
        padding-left: 16px;
        padding-right: 16px;
        padding-top: 8px;
        padding-bottom: 8px;
        font-size: 20px;
        cursor: pointer;
        transition: margin 0.15s, box-shadow 0.15s;
        box-shadow: 4px 4px 2px rgba(0, 0, 0, 0.15);
      }
      .shadow-3d-button:active {
        margin-left: 5px;
        margin-top: 5px;
        box-shadow: 0 0 0 rgba(0, 0, 0, 0);
      }
    </style>
  </head>
  <body>
    <button class="shadow-3d-button">Shadow</button>
  </body>
</html>
