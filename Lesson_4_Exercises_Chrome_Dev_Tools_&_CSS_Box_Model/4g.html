<!DOCTYPE html>
  <html>
    <head>
      <title>
        Buttons
      </title>
      <style>
        .youtube-button {
          background-color: red;
          color: white;
          padding-top: 10px;
          padding-bottom: 10px;
          padding-left: 20px;
          padding-right: 20px;
          border: none;
          border-radius: 2px;
          vertical-align: top;
          cursor: pointer;
          margin-right: 8px;
          transition: 0.15s;
        }
        .youtube-button:hover {
          opacity: 0.7;          
        }
        .youtube-button:active {
          opacity: 0.4;
        }
        .facebook-button {
          color: rgb(24, 119, 242);
          background-color: white;
          border: solid;
          border-color: rgb(24, 119, 242);
          border-width: 1px;
          border-radius: 2px;
          padding-top: 9px;
          padding-bottom: 9px;
          padding-left: 20px;
          padding-right: 20px;
          vertical-align: top;
          cursor: pointer;
          margin-right: 8px;
          transition: background-color 0.15s, color 0.15s;
        }
        .facebook-button:hover {
          background-color: rgb(24, 119, 242);
          color: white;
        }
        .facebook-button:active {
          opacity: 0.5;
        }
        .twitter-button {
          background-color: rgb(29, 161, 242);
          color: white;
          font-weight: bold;
          border: none;
          border-radius: 18px;
          padding-top: 9px;
          padding-bottom: 9px;
          padding-left: 20px;
          padding-right: 20px;
          vertical-align: top;
          cursor: pointer;
          transition: box-shadow 0.15s, opacity 0.15s;
        }
        .twitter-button:hover {
          box-shadow: 0 5px 5px rgba(0, 0, 0, 0.15);
        }
        .twitter-button:active {
          opacity: 0.7;
        }
      </style>
    </head>
    <body>
      <button class="youtube-button">
        SUBSCRIBE
      </button>
      <button class="facebook-button">
        JOIN
      </button>
      <button class="twitter-button">
        Tweet
      </button>
    </body>
  </html>
