<!DOCTYPE html>
  <html>
    <head>
      <title>
        Margin & Padding
      </title>
      <style>
        .stretch-button {
          appearance: none;
          background-color: green;
          color: white;
          font-size: 20px;
          margin-left: 10px;
          margin-right: 10px;
          border: none;
          padding: 8px 16px;
          cursor: pointer;
          transition: margin 0.15s, padding 0.15s;
        }
        .stretch-button:hover {
          margin-left: 2px;
          margin-right: 2px;
          padding: 8px 24px;
        }
      </style>
    </head>
    <body>
      <button class="stretch-button">
        One
      </button>
      <button class="stretch-button">
        Two
      </button>
      <button class="stretch-button">
        Three
      </button>
    </body>
  </html>
