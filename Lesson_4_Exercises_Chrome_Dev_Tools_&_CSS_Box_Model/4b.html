<!DOCTYPE html>
<html>
  <head>
    <title>
      Amazon Button
    </title>
    <style>
      .amazon-button {
        background-color: rgb(255 216 20);
        color: black;
        border-radius: 20px;
        padding-right: 20px;
        padding-left: 20px;
        padding-top: 10px;
        padding-bottom: 10px;
        border: none;
        font-size: 18px;
        font-weight: 500;
        cursor: pointer;
        transition: background-color 0.15s;
      }
      .amazon-button:hover {
        background-color: rgb(255, 238, 0);
      }
    </style>
  </head>
  <body>
    <button class="amazon-button">
      Add to Cart
    </button>
  </body>
</html>
