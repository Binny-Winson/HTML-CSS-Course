<!DOCTYPE html>
  <html>
    <head>
      <title>
        Profile in div element
      </title>
      <link rel="stylesheet" href="9g.css">
    </head>
    <body>
      <div class="all-profiles">
        <div class="profile-info">
          <img class="profile-picture" src="cat.jpg" alt="image of a Cat">
          <p class="profile-name">Oliver</p>
          <p class="total-friends">2 mutual friends</p>
          <button class="add-friend-button">Add Friend</button>
        </div>
        <div class="profile-info">
          <img class="profile-picture" src="cat2.jpg" alt="image of Cat2">
          <p class="profile-name">Tommy</p>
          <p class="total-friends">3 mutual friends</p>
          <button class="add-friend-button">Add Friend</button>
        </div>
        <div class="profile-info">
          <img class="profile-picture" src="cat3.jpeg" alt="image of a Cat3">
          <p class="profile-name">Cindy</p>
          <p class="total-friends">4 mutual friends</p>
          <button class="add-friend-button">Add Friend</button>
        </div>
      </div>
    </body>
  </html>
