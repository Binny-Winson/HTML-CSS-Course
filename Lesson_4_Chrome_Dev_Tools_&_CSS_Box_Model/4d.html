<!DOCTYPE html>
  <html>
    <head>
      <title>
        Bootstrap Button
      </title>
      <style>
        .get-started-button {
          background-color: rgb(121 82 179);
          color: white;
          border: none;
          padding-right: 20px;
          padding-left: 20px;
          padding-top: 10px;
          padding-bottom: 10px;
          border-radius: 3px;
          cursor: pointer;
          font-weight: bold;
          margin-right: 8px;
          transition: background-color 0.25s;
        }
        .get-started-button:hover {
          background-color: rgb(104, 48, 188);
        }
        .download-button {
          background-color: white;
          color: rgb(108 117 125);
          border-color: rgb(108 117 125);
          padding-right: 20px;
          padding-left: 20px;
          padding-top: 10px;
          padding-bottom: 10px;
          border-radius: 3px;
          cursor: pointer;
          border-style: solid;
          font-weight: bold;
          border-width: 1px;
          transition: background-color 0.25s, color 0.25s;
        }
        .download-button:hover {
          background-color: rgb(108 117 125);
          color: white
        }
      </style>
    </head>
    <body>
      <button class="get-started-button">
        Get started
      </button>
      <button class="download-button">
        Download
      </button>
    </body>
  </html>
