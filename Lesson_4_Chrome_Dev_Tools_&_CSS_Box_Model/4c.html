<!DOCTYPE html>
  <html>
    <head>
      <title>
        GitHub Button
      </title>
      <style>
        .github-button {
          background-color: rgb(46 164 79);
          color: white;
          border: none;
          padding-right: 20px;
          padding-left: 20px;
          padding-top: 10px;
          padding-bottom: 10px;
          cursor: pointer;
          font-weight: bold;
          font-size: 15px;
          border-radius: 6px;
          cursor: pointer;
          transition: box-shadow 0.15s;
        }
        .github-button:hover {
          box-shadow: 0 6px 6px rgba(0 0 0 / 0.15);
        }
      </style>
    </head>
    <body>
      <button class="github-button">
        Sign up
      </button>
    </body>
  </html>
