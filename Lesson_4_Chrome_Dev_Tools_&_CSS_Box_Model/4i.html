<!DOCTYPE html>
  <html>
    <head>
      <title>
        Stretch
      </title>
      <style>
        .stretch-button {
          background-color: green;
          color: white;
          padding-left: 16px;
          padding-right: 16px;
          padding-top: 8px;
          padding-bottom: 8px;
          border: none;
          font-size: 20px;
          cursor: pointer;
          transition: 0.7s
        }
        .stretch-button:hover {
          padding-left: 40px;
          padding-right: 40px;
          padding-top: 16px;
          padding-bottom: 16px;
        }
      </style>
    </head>
    <body>
      <button class="stretch-button">Stretch</button>
    </body>
  </html>
