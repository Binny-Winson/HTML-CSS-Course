<!DOCTYPE html>
<html>
  <head>
    <title>
      Text with Span
    </title>
    <style>
      p {
        font-family: Arial;
        margin-top: 0;
        margin-bottom: 0;
      }
      .price {
        font-size: 24px;
        margin-bottom: 8px;
      }

    </style>
  </head>
  <body>
    <p class="price">
      1,049.61 <span class="currency", style="color: gray; font-size: 14px;">  USD</span>
    </p>
    <p class="change-in-price", style="color: green; font-size: 16px; margin-bottom: 8px;">
      +18.05 (1.75%) today
    </p>
    <p class="after-hours-price", style="color: gray; font-size: 14px;">
      After hours 1,048.00 <span class="after-hours-change-in-price", style="color: red;">-1.61 (0.15%)</span>
    </p>
  </body>
</html>
