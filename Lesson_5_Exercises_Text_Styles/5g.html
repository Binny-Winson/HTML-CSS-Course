<!DOCTYPE html>
  <html>
    <head>
      <title>
        Text with Span
      </title>
      <style>
        p {
          font-family: Arial;
          margin-top: 0;
          margin-bottom: 0;
        }
      </style>
    </head>
    <body>
      <p style="font-size: 18px; font-weight: bold; margin-bottom: 8px;">
        freeCodeCamp.org <span style="color: gray; font-weight: 400;"> @freeCodeCamp 1h</span>
      </p>
      <p style="font-size: 18px; margin-bottom: 20px; width: 600px;">
        As a web developer, you'll want to make your projects easy to use and navigate around.
      </p>
      <p style="font-size: 18px;">
        Here <span style="color: lightskyblue;">@chp_it</span> outlines the top skills new developers should have.
      </p>
    </body>
  </html>
