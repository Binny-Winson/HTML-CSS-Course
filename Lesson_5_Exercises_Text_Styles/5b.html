<!DOCTYPE html>
  <html>
    <head>
      <title>
        Font = Arial
      </title>
      <style>
        .main-title {
          font-family: Arial;
          font-size: 24px;
          font-weight: bold;
          margin-bottom: 5px;
        }
        .sub-title {
          color: red;
          font-family: Arial;
          font-size: 18px;
          font-style: italic;
          font-weight: 500;
          margin-top: 0;
        }
      </style>
    </head>
    <body>
      <p class="main-title">
        Biggest Deals of the Year!
      </p>
      <p class="sub-title">
        Sales end Tuesday
      </p>
    </body>
  </html>
