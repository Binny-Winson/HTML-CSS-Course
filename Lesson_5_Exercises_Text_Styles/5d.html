<!DOCTYPE html>
  <html>
    <head>
      <title>
        Font = Arial
      </title>
      <style>
        p {
          font-family: Arial;
          text-align: center;
          margin-top: 0;
          margin-bottom: 0;
        }
        .title {
          font-size: 22px;
          font-weight: bold;
          margin-top: 20px;
          margin-bottom: 20px;
        }
        .sub-title {
          font-size: 13px;
          margin-bottom: 20px;
        }
        .link {
          font-size: 13px;
          color: blue;
        }
      </style>
    </head>
    <body>
      <p class="title">
        Shopping for your business&#63;
      </p>
      <P class="sub-title">
        See how Apple at Work can help
      </P>
      <P class="link">
        Learn more &#62;
      </P>
    </body>
  </html>
