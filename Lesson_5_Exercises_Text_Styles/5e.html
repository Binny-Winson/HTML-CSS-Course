<!DOCTYPE html>
<html>
  <head>
    <title>
      Apple MacBook Pro
    </title>
    <style>
      p, button {
        font-family: Arial;
        margin-top: 0;
        margin-bottom: 0;
        text-align: center;
      }
      .first-text {
        color: orange;
        margin-bottom: 10px;
        font-size: 10px;
        font-weight: bold;
      }
      .product {
        font-size: 18px;
        font-weight: bold;
        margin-bottom: 10px;
      }
      .tagline {
        font-size: 24px;
        font-weight: bold;
        margin-bottom: 10px;
      }
      .price {
        font-size: 10px;
        color: gray;
        margin-bottom: 10px;
      }
      .buy {
        background-color: rgb(24, 119, 242);
        color: white;
        font-size: 10px;
        font-weight: bold;
        padding: 6px 10px;
        border-radius: 11px;
      }
    </style>
  </head>
  <body>
    <p class="first-text">
      New
    </p>
    <p class="product">
      MacBook Pro
    </p>
    <p class="tagline">
      Supercharged for pros.
    </p>
    <p class="price">
      From $1999
    </p>
    <p>
      <span class="buy">Buy</span>
    </p>
  </body>
</html>
